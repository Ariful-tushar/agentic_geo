# Valtra profile for AnswerWatch — ready to import with:
#   python -m app.cli import-profile valtra.profile.yaml
#   python -m app.cli validate-profile valtra.profile.yaml   (check first)
#
# Every fact below was checked against valtra.co.uk, news.agcocorp.com, and AGCO's FY2025
# annual report (SEC filing) on 2026-10-24. Nothing was invented or estimated. Two figures
# ("~1,300 employees at Suolahti" and the EUR 38m CVT investment) are dated because Valtra/
# AGCO do not restate them every year — re-check expected_source_url before relying on them
# long-term, the same way Kemira's F04/F05 are flagged for re-checking after interim reports.
#
# Competitors are the tractor brands actually sold and marketed in the Finnish market
# nationally (not local Jyväskylä rivals) — the brands a Finnish farmer would actually
# cross-shop against Valtra.

id: valtra
name: Valtra
aliases:
  - Valtra Oy Ab
  - Valmet (historical name, pre-2001)
domains:
  - valtra.com
  - valtra.co.uk
  - valtra.fi
  - agcocorp.com
  - news.agcocorp.com
wikipedia_title: Valtra
contact_emails:
  - arifultusharr@gmail.com
monitoring_enabled: true
emails_enabled: true

competitors:
  - name: John Deere
    aliases:
      - Deere & Company
