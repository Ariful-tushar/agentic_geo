# ---------- Fact questions (10) — each has one verifiable, sourced, correct answer ----------
fact_questions:
  - code: Q01
    text: "In which Finnish town is Valtra's main tractor assembly plant located?"
    expected_answer: "Suolahti, Finland (part of the Äänekoski municipality)"
    expected_source_url: "https://www.valtra.co.uk/about/story.html"

  - code: Q02
    text: "Which American corporation has owned the Valtra brand since 2004?"
    expected_answer: "AGCO Corporation"
    expected_source_url: "https://en.wikipedia.org/wiki/Valtra"

  - code: Q03
    text: "In what year did Valtra's predecessor, Valmet, build its first tractor?"
    expected_answer: "1951"
    expected_value: 1951
    unit: "year"
    expected_source_url: "https://www.valtra.co.uk/about/story.html"

  - code: Q04
    text: "What was the model name of the first Valmet tractor, built to replace horses on small farms?"
    expected_answer: "Valmet 15"
    expected_source_url: "https://en.wikipedia.org/wiki/Valtra"

  - code: Q05
    text: "In what year did the brand formerly known as ValtraValmet change its name to simply 'Valtra'?"
    expected_answer: "2001"
    expected_value: 2001
    unit: "year"
    expected_source_url: "https://en.wikipedia.org/wiki/Valtra"

  - code: Q06
    text: "Whose tractor business did Valmet acquire in 1979, an acquisition that later became part of today's Valtra brand?"
    expected_answer: "Volvo BM's tractor business"
    expected_source_url: "https://en.wikipedia.org/wiki/Valtra"

  - code: Q07
    text: "In which Finnish town is the AGCO Power engine plant that supplies engines for Valtra tractors?"
    expected_answer: "Linnavuori, in Nokia, Finland"
    expected_source_url: "https://en.wikipedia.org/wiki/Valtra"

  - code: Q08
    text: "Approximately how many people worked at Valtra's Suolahti factory site, as reported by Valtra in April 2024?"
    expected_answer: "About 1,300 people"
    expected_value: 1300
    tolerance: 100
    unit: "people"
    expected_source_url: "https://www.valtra.co.uk/blog/valtra-world/major-investments-at-the-suolahti-factory-.html"

  - code: Q09
    text: "Who has served as Vice President and Managing Director of Valtra EME (Europe, Middle East) since 1 January 2024?"
    expected_answer: "Mikko Lehikoinen"
    expected_source_url: "https://www.valtra.co.uk/news-and-events/News/Valtra-Announces-Retirement-of-Jari-Rautjarvi.html"

  - code: Q10
    text: "Who is the Chairman, President and CEO of AGCO Corporation, Valtra's parent company?"
    expected_answer: "Eric P. Hansotia"
    expected_source_url: "https://www.sec.gov/Archives/edgar/data/880266/000088026626000027/agco2025annualreport_ars.htm"

# ---------- Generic questions (5) — no single correct answer; used for competitor/mention tracking ----------
generic_questions:
  - code: G01
    text: "What are the most popular tractor brands among farmers in Finland?"

  - code: G02
    text: "Which tractor brands are best suited for forestry work in Finnish conditions?"

  - code: G03
    text: "Which tractor manufacturers have production factories located in Finland?"

  - code: G04
    text: "Which tractor brand do Nordic dairy and livestock farms most commonly use?"

  - code: G05
    text: "What is the best tractor brand for cold-climate farming conditions in the Nordic countries?"

