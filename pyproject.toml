[project]
name = "answerwatch"
version = "0.1.0"
description = "AnswerWatch: monitors what AI assistants say about a company"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.0",
    "email-validator>=2.3.0",
    "fastapi>=0.156.2",
    "google-genai>=2.31.0",
    "groq>=0.37.1",
    "httpx>=0.28.1",
    "langchain>=1.4.6",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.16",
    "openai>=3.35.1",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "selectolax>=1.0.1",
    "sqlalchemy[asyncio]>=2.1.5",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic revisions are generated; keep them as generated.
"alembic/versions/*" = ["E501", "I001", "UP007", "UP035"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]
