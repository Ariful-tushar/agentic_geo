name: ci
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: answerwatch, POSTGRES_PASSWORD: answerwatch, POSTGRES_DB: answerwatch }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U answerwatch" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://answerwatch:answerwatch@localhost:5432/answerwatch
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.1
      - run: uv sync
      - run: uv run alembic upgrade head
      - run: uv run ruff check .
      - run: uv run pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend (skipped until frontend/ exists)
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend
            npm ci
            npm run build
          else
            echo "No frontend yet, skipping."
          fi
